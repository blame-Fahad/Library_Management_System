{% extends "base.html" %}

{% block title %}Student Registration - Smart Library{% endblock %}

{% block content %}
<div class="form-card">
  <h2 class="form-title">📝 Student Registration</h2>
  
  <form action="{{ url_for('register') }}" method="POST">
    <div class="form-group">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. John Doe" required>
    </div>

    <div class="form-group">
      <label for="username">Choose Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="e.g. johndoe" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="e.g. student@university.edu" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
    </div>

    <button type="submit" class="btn btn-success btn-block" style="padding: 10px; font-size: 1rem; margin-top: 1rem;">
      Register Account
    </button>
  </form>

  <p style="text-align: center; margin-top: 1.2rem; font-size: 0.9rem; color: #64748b;">
    Already registered? <a href="{{ url_for('login') }}" style="color: var(--primary-light); font-weight: 600;">Log In here</a>
  </p>
</div>
{% endblock %}

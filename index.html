<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var _realFetch = window.fetch ? window.fetch.bind(window) : null;
          var _activeFetch = _realFetch;

          function getFetch() {
            return _activeFetch;
          }
          function setFetch(fn) {
            _activeFetch = fn;
          }

          try {
            Object.defineProperty(window, 'fetch', {
              get: getFetch,
              set: setFetch,
              configurable: true,
              enumerable: true,
            });
          } catch (e1) {}

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: getFetch,
                set: setFetch,
                configurable: true,
                enumerable: true,
              });
            } catch (e2) {}
          }
        } catch (err) {
          // ignore
        }
      })();
    </script>

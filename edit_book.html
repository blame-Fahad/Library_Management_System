{% extends "base.html" %}

{% block title %}Edit Book - Admin{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 650px;">
  <h2 class="form-title">✏️ Edit Book #{{ book.id }}</h2>

  <form action="{{ url_for('edit_book', book_id=book.id) }}" method="POST">
    <div class="form-group">
      <label for="title">Book Title *</label>
      <input type="text" id="title" name="title" class="form-control" value="{{ book.title }}" required>
    </div>

    <div style="display: flex; gap: 15px;">
      <div class="form-group" style="flex: 1;">
        <label for="author">Author *</label>
        <input type="text" id="author" name="author" class="form-control" value="{{ book.author }}" required>
      </div>

      <div class="form-group" style="flex: 1;">
        <label for="category">Category / Genre *</label>
        <input type="text" id="category" name="category" class="form-control" value="{{ book.category }}" required>
      </div>
    </div>

    <div style="display: flex; gap: 15px;">
      <div class="form-group" style="flex: 1;">
        <label for="isbn">ISBN Number *</label>
        <input type="text" id="isbn" name="isbn" class="form-control" value="{{ book.isbn }}" required>
      </div>

      <div class="form-group" style="flex: 1;">
        <label for="total_copies">Total Copies</label>
        <input type="number" id="total_copies" name="total_copies" class="form-control" value="{{ book.total_copies }}" min="1" required>
      </div>
    </div>

    <div class="form-group">
      <label for="description">Book Description / Keywords</label>
      <textarea id="description" name="description" class="form-control" rows="4">{{ book.description }}</textarea>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
      <button type="submit" class="btn btn-primary" style="flex: 1;">Update Book</button>
      <a href="{{ url_for('manage_books') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
